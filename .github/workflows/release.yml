# Builds the watchface and publishes it as a GitHub Release when a version tag is pushed.
#
#   git tag v26.11.1 && git push origin v26.11.1
#
# Versions are YY.MM.REV with no leading zeros (the appstore wants numbers <= 255 per part). Bump
# package.json "version", VERSION in main.js and APP_VERSION in pkjs together; the job checks.
#
# Tags containing "beta" or "rc" are published as pre-releases. The release notes are the matching
# "## v<version>" section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install the Pebble SDK
        run: |
          uv tool install pebble-tool --python 3.13
          # the installer asks to accept the licence; answer it (exit code is SIGPIPE noise)
          yes | pebble sdk install latest || true
          pebble --version

      - name: Check the start frame's glyphs match the fonts
        run: uv run --with pillow python3 tools/gen_startframe.py --check

      - name: Build
        run: pebble build

      - name: Check the build is a release build
        run: |
          grep -q '^const DEMO = false;' src/embeddedjs/main.js
          grep -q '^var MOCK = false;' src/pkjs/index.js
          # tag, package.json (what the appstore reads) and both in-code versions must agree
          V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"
          grep -q "\"version\": \"$V\"" package.json
          grep -q "^const VERSION = \"$V\";" src/embeddedjs/main.js
          grep -q "^var APP_VERSION = \"$V\";" src/pkjs/index.js

      - name: Prepare release files
        id: prep
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp build/*.pbw "GielinorHUD-${TAG}.pbw"   # build/<folder name>.pbw
          # release notes: the CHANGELOG section for this tag, up to the next "## "
          awk -v t="## ${TAG}" '$0 ~ "^## " { p = (index($0, t) == 1) } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Gielinor HUD ${TAG}" > notes.md
          case "$TAG" in *beta*|*rc*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac

      - uses: softprops/action-gh-release@v2
        with:
          files: GielinorHUD-${{ github.ref_name }}.pbw
          body_path: notes.md
          prerelease: ${{ steps.prep.outputs.pre }}
